[workspace]
resolver = "2"
members = [
  "packages/contracts/rust",
  "apps/gateway",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/olo-labs/olo-toolgate"
version = "0.2.0-dev"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
olo-toolgate-contracts = { path = "packages/contracts/rust", version = "0.2.0-dev" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "test-util"] }
jsonschema = { version = "0.58.4", default-features = false }
sha2 = "0.11.0"
subtle = "2.6.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }
base64 = "0.22.1"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
