# Services are opt-in; production PostgreSQL and credentials remain external.
global:
  imageRegistry: ghcr.io/olo-labs
  imagePullSecrets: []
gateway:
  enabled: false
  replicaCount: 2
  image:
    repository: olo-toolgate-gateway
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  credentialsSecret: ''
  credentialsKey: credentials.json
  bundle:
    enabled: false
    url: https://control.example.invalid/api/control/v1/bundles/current
    tenantId: example
    issuer: control
    audience: gateway
    keyringSecret: ''
    keyringKey: keyring.json
    tokenSecret: ''
    tokenKey: access-token
    trustRevision: '1'
    minimumSequence: 0
    maxGraceMs: 0
    pollIntervalMs: 5000
    fetchTimeoutMs: 3000
    controlPort: 443
  config:
    listen: 0.0.0.0:8081
    managementListen: 0.0.0.0:9091
    trustedTlsProxy: true
    allowedOrigins: []
    limits:
      maxBodyBytes: 65536
      maxHeaderBytes: 8192
      maxConcurrentRequests: 128
      maxConnections: 256
      requestsPerSecond: 1000
      requestTimeoutMs: 2000
      connectionTimeoutMs: 10000
      shutdownTimeoutMs: 15000
      auditQueueCapacity: 256
    policy:
      version: 0.1.0-dev
      expiresAtUnixMs: 4102444800000
      emergencyBlock: false
      rules: []
    extractors:
    - toolId: files.read
      action: read
      pointer: /path
      kind: FILE
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  networkPolicy:
    enabled: true
    runtimeFrom: []
    managementFrom: []
    controlTo: []
    dnsTo: []
  ingress:
    enabled: false
    className: ''
    annotations: {}
    host: gateway.example.invalid
    tlsSecret: ''
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
control:
  enabled: false
  bundle:
    enabled: false
    keyId: bundle-key-1
    issuer: control
    audience: gateway
    signingSecret: ''
    signingKey: private.pem
    keyRevision: '1'
  replicaCount: 2
  image:
    repository: olo-toolgate-control
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 768Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  networkPolicy:
    enabled: true
    runtimeFrom: []
    managementFrom: []
    databaseTo: []
    dnsTo: []
    collectorTo: []
  ingress:
    enabled: false
    className: ''
    annotations: {}
    host: control.example.invalid
    tlsSecret: ''
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
  developmentMode: false
  publicKeySecret: ''
  publicKeyKey: public.pem
  jwt:
    issuer: https://identity.example.invalid
    audience: toolgate-control
  tracing:
    enabled: false
    host: collector.example.invalid
    port: 4317
    protocol: grpc
  database:
    host: postgres.example.invalid
    port: 5432
    name: toolgate
    credentialsSecret: ''
    sslMode: verify-full
    caSecret: ''
    caKey: ca.crt
  limits:
    maxRecords: 512
    maxConfigBytes: 1048576
