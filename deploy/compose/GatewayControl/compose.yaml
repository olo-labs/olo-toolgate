name: toolgate-gateway-control
x-helper: &helper
  image: ${HELPER_IMAGE:-ololab/olo-toolgate-quickstart:dev}
  platform: linux/amd64
  entrypoint: [/opt/quickstart-python/bin/python, /setup/setup.py]
  volumes:
    - ./setup.py:/setup/setup.py:ro
    - custody:/custody
    - control-config:/control-config
    - gateway-config:/gateway-config
    - db-init:/db-init
    - proxy-tls:/proxy-tls
    - redis-config:/redis-config
services:
  setup:
    <<: *helper
    profiles: [setup]
    user: "0:0"
    network_mode: none
    command: [init]
    volumes:
      - ./setup.py:/setup/setup.py:ro
      - ./env:/host-env
      - custody:/custody
      - control-config:/control-config
      - gateway-config:/gateway-config
      - db-init:/db-init
      - proxy-tls:/proxy-tls
      - redis-config:/redis-config
  token:
    <<: *helper
    profiles: [setup]
    user: "0:0"
    network_mode: none
    command: [token]
    volumes:
      - ./setup.py:/setup/setup.py:ro
      - custody:/custody:ro
  probe:
    <<: *helper
    profiles: [setup]
    command: [probe]
    volumes: [./setup.py:/setup/setup.py:ro]
    networks: [backend]
    env_file:
      - path: ./env/.env.cache
        required: false
        format: raw
  postgres:
    profiles: [database]
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /bootstrap/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - db-init:/bootstrap:ro
      - db-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    mem_limit: 512m
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
  control:
    image: ${CONTROL_IMAGE:-ololab/olo-toolgate-control:dev}
    platform: linux/amd64
    entrypoint: [/bin/sh, -c, '. /config/identity.env; exec java -jar /app/quarkus-run.jar']
    env_file:
      - path: ./env/.env.db
        format: raw
        required: false
      - path: ./env/.env.cache
        format: raw
        required: false
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=65532,gid=65532
    mem_limit: 1g
    cpus: 2
    volumes: [control-config:/config:ro]
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    stop_grace_period: 30s
  redis:
    profiles: [database]
    image: redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
    restart: unless-stopped
    command: [redis-server, /config/redis.conf]
    volumes:
      - redis-config:/config:ro
    networks: [backend]
    read_only: true
    tmpfs:
      - /data:rw,nosuid,noexec,size=128m,uid=999,gid=999
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /config/password) redis-cli --no-auth-warning ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  gateway:
    image: ${GATEWAY_IMAGE:-ololab/olo-toolgate-gateway:dev}
    entrypoint: [/usr/local/bin/olo-toolgate-gateway]
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    environment:
      TOOLGATE_GATEWAY_CONFIG: /config/gateway.json
      TOOLGATE_GATEWAY_CREDENTIALS: /config/credentials.json
    volumes: [gateway-config:/config:ro]
    networks: [backend]
    stop_grace_period: 20s
  proxy:
    profiles: [proxy]
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    ports: ["127.0.0.1:${STACK_TLS_PORT:-8444}:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - proxy-tls:/tls:ro
    depends_on: [control, gateway]
    networks: [frontend, backend]
    mem_limit: 128m
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/ready']
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 15s
networks:
  frontend:
  backend:
    internal: true
volumes:
  custody:
  control-config:
  gateway-config:
  db-init:
  proxy-tls:
  postgres-data:
  redis-config:
