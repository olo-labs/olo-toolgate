server {
    listen 8080;
    location = /ready { proxy_pass http://control:9092/q/health/ready; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log off;
    location /access/ { proxy_pass http://gateway:8081; }
    location = /mcp { proxy_pass http://gateway:8081; proxy_read_timeout 35s; }
    location /q/ { return 404; }
    location /v1/ { return 404; }
    location / { proxy_pass http://control:8082; }
}
