name: Feature request
description: Propose a user-facing or contributor improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Describe the experience before implementation details.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: Optional.

  - type: textarea
    id: security
    attributes:
      label: Security / permission implications
      description: Which users, agents, devices, resources or credentials could be affected?
