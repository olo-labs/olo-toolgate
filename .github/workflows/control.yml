name: control
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image from the matching version tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  container-and-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned validation and cluster tooling
        run: |
          python -m pip install -r tools/requirements.txt
          curl --fail --location --proto '=https' -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          curl --fail --location --proto '=https' -o kind.sha256sum https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64.sha256sum
          test "$(sha256sum kind | cut -d' ' -f1)" = "$(cut -d' ' -f1 kind.sha256sum)"
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          curl --fail --location --proto '=https' -o kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          curl --fail --location --proto '=https' -o kubectl.sha256 https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl.sha256
          test "$(sha256sum kubectl | cut -d' ' -f1)" = "$(cat kubectl.sha256)"
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
          curl --fail --location --proto '=https' -o helm.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl --fail --location --proto '=https' -o helm.sha256sum https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          test "$(sha256sum helm.tar.gz | cut -d' ' -f1)" = "$(cut -d' ' -f1 helm.sha256sum)"
          tar -xzf helm.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Control and canonical contract gates
        run: |
          python tools/contracts/version.py --check
          python tools/contracts/generate.py --check
          python tools/quality.py
          python -m unittest discover -s tests/contracts -v
          python tools/control/check.py
          python tools/check.py --scans
          python tools/control/helm.py
      - name: Build, smoke and scan production image
        run: |
          python tools/control/container.py
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-control:module02
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/control:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/control-sbom.cdx.json olo-toolgate-control:module02
          python tools/control/cluster.py
          docker save olo-toolgate-control:module02 -o build/control/image.tar
          cp CHANGELOG.md docs/control-plane/upgrades.md build/control/
          (cd build/control && sha256sum image.tar control-sbom.cdx.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-evidence
          path: build/control/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' && inputs.publish
    needs: container-and-cluster
    runs-on: ubuntu-24.04
    environment: control-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: control-evidence
          path: build/control
      - name: Publish the exact scanned image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_ACTOR: ${{ github.actor }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          version="$(cat VERSION)"
          test "$RELEASE_REF" = "refs/tags/v${version}"
          (cd build/control && sha256sum --check SHA256SUMS)
          docker load -i build/control/image.tar
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
          image="ghcr.io/olo-labs/olo-toolgate-control:${version}"
          docker tag olo-toolgate-control:module02 "$image"
          docker push "$image"
          digest="$(docker inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/olo-labs/olo-toolgate-control
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/control/control-sbom.cdx.json
