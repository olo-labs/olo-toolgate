name: endpoint-client
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, binary: olo-toolgate-client}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: olo-toolgate-client}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc, binary: olo-toolgate-client.exe}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc, binary: olo-toolgate-client.exe}
          - {runner: macos-15-intel, target: x86_64-apple-darwin, binary: olo-toolgate-client}
          - {runner: macos-15, target: aarch64-apple-darwin, binary: olo-toolgate-client}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify native target and source
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          rustup show
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$NATIVE_TARGET"
          cargo fmt --all --check
          cargo clippy -p olo-toolgate-client --all-targets --locked -- -D warnings
          cargo test -p olo-toolgate-client --locked
          cargo build -p olo-toolgate-client --release --locked
      - name: Package checksums and dependency SBOM
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_BINARY: ${{ matrix.binary }}
        run: python tools/client/package.py --target "$NATIVE_TARGET" --binary "target/release/$NATIVE_BINARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: endpoint-client-${{ matrix.target }}
          path: build/client/release/
          if-no-files-found: error
