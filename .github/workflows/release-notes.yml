name: Release-note fragments
'on':
  pull_request:
    paths:
    - '.changes/**'
    - 'tools/release/notes.py'
    - 'tools/release/prepare.py'
    - 'tests/contracts/test_release_fragments.py'
    - '.github/workflows/release-notes.yml'
    - 'tools/requirements.txt'
  workflow_dispatch:
    inputs:
      version:
        description: Version to preview (for example v0.1.0-beta.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  fragments:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install -r tools/requirements.txt
    - run: python tools/release/notes.py validate
    - run: python -m unittest discover -s tests/contracts -p test_release_fragments.py -v
    - name: Compile selected version
      if: github.event_name == 'workflow_dispatch'
      env:
        RELEASE_NOTES_VERSION: ${{ inputs.version }}
      run: python tools/release/notes.py compile --version "$RELEASE_NOTES_VERSION" --output build/release-notes.md
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: github.event_name == 'workflow_dispatch'
      with:
        name: release-note-preview
        path: build/release-notes.md
        if-no-files-found: error
