name: signed-policy-and-approval-compatibility
on:
  workflow_call:
permissions:
  contents: read
jobs:
  policy-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TOOLGATE_DOCKER_TOOLS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Early release metadata gate
        run: python tools/ci/preflight.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Contract compatibility and genuine cross-component bundle flow
        run: |
          python -m pip install -r tools/requirements.txt
          python tools/contracts/version.py --check
          python tools/contracts/generate.py --check
          python -m unittest discover -s tests/contracts -v
          python tools/approval/check.py --build
          python tools/policy/check.py
          python tools/approval/helm.py
          python tools/policy/helm.py
          python tools/gateway/benchmark.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-policy-evidence
          path: |
            build/policy/
            build/approval/
            build/gateway/bundle-benchmark.json
          if-no-files-found: error
