name: gradle

on:
  pull_request:
    paths:
      - "**/*.java"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/gradle.yml"
  push:
    branches: [main]
    paths:
      - "**/*.java"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"

jobs:
  java:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Java modules
        run: ./gradlew --no-daemon javaCheck
