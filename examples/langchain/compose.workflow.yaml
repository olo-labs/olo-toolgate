services:
  quickstart:
    environment:
      TOOLGATE_WORKFLOW_MODEL_ORIGINS: https://workflow-model:8443
      TOOLGATE_WORKFLOW_MODEL_CA_FILE: /run/model-ca.crt
    volumes:
      - ${TOOLGATE_LANGCHAIN_STATE:-.state}/workflow/model-ca.crt:/run/model-ca.crt:ro
  workflow-model:
    image: ${TOOLGATE_WORKFLOW_LLAMA_IMAGE:?Set the llama.cpp server image}
    command: [--model, /model.gguf, --alias, intake-model, --host, 0.0.0.0, --port, '8443', --ctx-size, '4096', --threads, '4', --ssl-cert-file, /custody/model.crt, --ssl-key-file, /custody/model.key, --api-key-file, /custody/model.token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /trust/model-ca.crt, 'https://workflow-model:8443/health']
      interval: 5s
      timeout: 3s
      retries: 36
    volumes:
      - ${TOOLGATE_WORKFLOW_MODEL_FILE:?Set the GGUF model file}:/model.gguf:ro
      - ${TOOLGATE_LANGCHAIN_STATE:-.state}/workflow/model:/custody:ro
      - ${TOOLGATE_LANGCHAIN_STATE:-.state}/workflow/model-ca.crt:/trust/model-ca.crt:ro
  workflow-worker:
    image: toolgate-langgraph-runtime:local
    build:
      context: ../../apps/langgraph-runtime
    network_mode: service:registry
    command: [--control-origin, 'https://localhost:${TOOLGATE_TLS_PORT:-18451}', --gateway-origin, 'https://localhost:${TOOLGATE_TLS_PORT:-18451}', --control-ca-file, /custody/gateway-ca.crt, --gateway-ca-file, /custody/gateway-ca.crt, --token-file, /custody/worker.token, --once]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${TOOLGATE_LANGCHAIN_STATE:-.state}/workflow/worker:/custody:ro
