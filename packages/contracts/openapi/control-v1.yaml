components:
  securitySchemes:
    adminAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 token with verified issuer/audience/expiry and signed tenant_id/groups. Not a
        Gateway runtime credential.
    deviceCertificate:
      type: mutualTLS
      description: Direct verified device TLS identity; forwarded identity headers never authenticate.
