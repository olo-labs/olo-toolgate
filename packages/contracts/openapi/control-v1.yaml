        '404': *id004
        '409': *id005
        '413': *id006
        '415': *id007
        '500': *id008
        '503': *id009
      parameters:
      - *id010
      - &id011
        name: If-Match
        in: header
        required: true
        description: Quoted current record revision, or tenant export revision for import.
        schema:
          type: string
          pattern: ^"(0|[1-9][0-9]*)"$
      requestBody:
        required: true
        content:
