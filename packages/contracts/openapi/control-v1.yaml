openapi: 3.1.0
info:
  title: OLO ToolGate Control Plane API
  version: 0.10.0-dev
  description: Tenant-scoped administration and explicit signed policy publication.
    Directory policies become runtime configuration only after publication; bundle
    trust is separate from execution permits.
security:
- adminAccessToken: []
paths:
  /api/public/v1/clients:
    get:
      operationId: publicClientDownloads
      security: []
      responses:
        '200':
          description: Verified immutable client release packages
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/builtins.schema.json#/$defs/ClientDownloadManifest
        '503':
          description: No published release bundle
  /api/public/v1/clients/{filename}:
    get:
      operationId: publicClientBinary
      security: []
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Checksum-verified archive with dependency SBOM
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Filename is not in the immutable manifest
        '429':
          description: Public transfer capacity reached
        '503':
          description: Release unavailable or integrity validation failed
  /.well-known/olo-toolgate-client:
    get:
      operationId: clientDiscovery
      description: Direct HTTPS. Detached RS256 signature over domain-prefixed exact
        payload bytes. TLS origin bootstraps dedicated device CA.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/SignedClientDiscovery
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      security: []
  /api/control/v1/endpoint/enrollments:
    post:
      operationId: startEndpointEnrollment
      description: Anonymous direct HTTPS, verified P-256 CSR, bounded pending quota.
        This challenge creation is not a grant and may be repeated after a lost response.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentChallenge
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentStart
      security: []
  /api/control/v1/endpoint/enrollments/poll:
    post:
      operationId: pollEndpointEnrollment
      description: Device code proves possession; minimum five-second poll interval,
        ten-minute expiry. Exact certificate response may be recovered until expiry.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentResult
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentPoll
      security: []
  /api/control/v1/endpoint/enrollments/review:
    get:
      operationId: reviewEndpointEnrollment
      description: Dedicated toolgate-enroller and signed user_id mapping to enabled
        same-tenant user. Compare code and key fingerprint on the device.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentReview
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-F0-9]{16}$
  /api/control/v1/endpoint/enrollments/decision:
    post:
      operationId: decideEndpointEnrollment
      description: Dedicated toolgate-enroller confirms device for their signed enabled
        user. Approval, identity registration, directory metadata, audit and idempotency
        commit atomically.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentReview
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentDecision
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /api/control/v1/endpoint/check-in:
    post:
      operationId: endpointCheckIn
      description: Actual verified TLS peer certificate plus active registry. No bearer/header
        substitute. Sequence and exact report replay are transactional; certificates
        renew before expiry.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointCheckInAck
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointCheckIn
      security: []
  /api/control/v1/endpoint/devices/{id}:
    get:
      operationId: getEndpointDevice
      description: Administrative enrolled identity view. Directory metadata alone
        never authenticates a device.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointDeviceRecord
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      parameters:
      - &id001
        name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /api/control/v1/endpoint/devices/{id}/revoke:
    post:
      operationId: revokeEndpointDevice
      description: Administrator revocation; expected revision, durable idempotency
        and audit. Next check-in rejects even before certificate expires.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointDeviceRecord
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointRevokeRequest
      parameters:
      - *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /api/control/v1/approvals:
    get:
      operationId: listApprovals
      description: Requires tenant-scoped toolgate-approver, signed user_id and enabled
        directory user. Durable status; no raw arguments.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/approval.schema.json#/$defs/ApprovalPage
        '400':
          description: Invalid canonical input
        '401':
          description: Valid signed short-lived JWT required
        '403':
          description: Role, tenant or approver identity denied
        '404':
          description: Approval not found
        '409':
          description: Stale revision, obsolete policy or spent permit
        '413':
          description: Request too large
        '503':
          description: Approval dependency unavailable
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /api/control/v1/approvals/{id}:
    get:
      operationId: getApproval
      description: Same approver requirements; tenant isolation.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/approval.schema.json#/$defs/ApprovalRecord
        '400':
          description: Invalid canonical input
        '401':
          description: Valid signed short-lived JWT required
        '403':
          description: Role, tenant or approver identity denied
        '404':
          description: Approval not found
        '409':
          description: Stale revision, obsolete policy or spent permit
        '413':
          description: Request too large
        '503':
          description: Approval dependency unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/control/v1/approvals/{id}/decision:
    post:
      operationId: decideApproval
      description: Dedicated approver role; requester cannot self-approve. Expected
        revision and durable idempotency. Duration required only for APPROVE_TEMPORARY,
        capped at 30 minutes and fresh current policy. Deny does not authorize execution.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/approval.schema.json#/$defs/ApprovalRecord
        '400':
          description: Invalid canonical input
        '401':
          description: Valid signed short-lived JWT required
        '403':
          description: Role, tenant or approver identity denied
        '404':
          description: Approval not found
        '409':
          description: Stale revision, obsolete policy or spent permit
        '413':
          description: Request too large
        '503':
          description: Approval dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/approval.schema.json#/$defs/ApprovalDecisionRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
  /api/control/v1/approvals/resolve:
    post:
      operationId: resolveApproval
      description: Dedicated toolgate-approval-gateway role only. Resolves or creates
        exact-bound current ASK. Once grant is spent atomically at lease issuance;
        no ALLOW replay. Temporary grants still require online resolution each attempt.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/approval.schema.json#/$defs/ApprovalResolution
        '400':
          description: Invalid canonical input
        '401':
          description: Valid signed short-lived JWT required
        '403':
          description: Role, tenant or approver identity denied
        '404':
          description: Approval not found
        '409':
          description: Stale revision, obsolete policy or spent permit
        '413':
          description: Request too large
        '503':
          description: Approval dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/approval.schema.json#/$defs/ApprovalSubmission
  /api/control/v1/approvals/permits/consume:
    post:
      operationId: consumeApprovalPermit
      description: Dedicated toolgate-approval-gateway role only. Atomically consumes
        exact-bound unexpired jti once. Duplicate requests reject; no replayed success.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/approval.schema.json#/$defs/ApprovalResolution
        '400':
          description: Invalid canonical input
        '401':
          description: Valid signed short-lived JWT required
        '403':
          description: Role, tenant or approver identity denied
        '404':
          description: Approval not found
        '409':
          description: Stale revision, obsolete policy or spent permit
        '413':
          description: Request too large
        '503':
          description: Approval dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/approval.schema.json#/$defs/ApprovalPermitUse
  /api/control/v1/bundles/current:
    get:
      operationId: getCurrentPolicyBundle
      description: Tenant-scoped immutable signed current bundle. Requires admin,
        reader or dedicated toolgate-bundle-reader. No-store; ETag is sequence. Refresh
        authentication externally.
      responses:
        '200':
          description: Signed bundle; clients must verify signature, hash, tenant,
            trust claims and freshness before adoption
          headers:
            ETag:
              schema:
                type: string
              description: Quoted immutable sequence
            X-Request-ID:
              schema:
                type: string
              description: Server correlation ID
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/bundle.schema.json#/$defs/SignedPolicyBundle
        '401':
          description: Valid short-lived access token required
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '403':
          description: Role forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '404':
          description: No publication or historical version in this tenant
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '503':
          description: Signing disabled, signing failure or database unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
  /api/control/v1/bundles/versions/{sequence}:
    get:
      operationId: getPolicyBundleVersion
      description: Exact immutable historical bytes. Requires admin or reader. Historical
        expiry is not extended.
      parameters:
      - name: sequence
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      responses:
        '200':
          description: Signed bundle; clients must verify signature, hash, tenant,
            trust claims and freshness before adoption
          headers:
            ETag:
              schema:
                type: string
              description: Quoted immutable sequence
            X-Request-ID:
              schema:
                type: string
              description: Server correlation ID
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/bundle.schema.json#/$defs/SignedPolicyBundle
        '401':
          description: Valid short-lived access token required
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '403':
          description: Role forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '404':
          description: No publication or historical version in this tenant
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '503':
          description: Signing disabled, signing failure or database unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
  /api/control/v1/bundles/publish:
    post:
      operationId: publishPolicyBundle
      description: "Admin only. Compile current directoryRevision and atomically publish\
        \ expectedSequence+1 with audit and durable replay. rollbackOf must be absent.\
        \ Lifetime is 1 second\xC3\u0192\xC6\u2019\xC3\u201A\xC2\xA2\xC3\u0192\xC2\
        \xA2\xC3\xA2\xE2\u201A\xAC\xC5\xA1\xC3\u201A\xC2\xAC\xC3\u0192\xC2\xA2\xC3\
        \xA2\xE2\u20AC\u0161\xC2\xAC\xC3\u2026\xE2\u20AC\u015324 hours; grace is 0\xC3\
        \u0192\xC6\u2019\xC3\u201A\xC2\xA2\xC3\u0192\xC2\xA2\xC3\xA2\xE2\u201A\xAC\
        \xC5\xA1\xC3\u201A\xC2\xAC\xC3\u0192\xC2\xA2\xC3\xA2\xE2\u20AC\u0161\xC2\xAC\
        \xC3\u2026\xE2\u20AC\u01535 minutes. Publication does not execute tools."
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: ../schemas/v1/identifiers.schema.json#/$defs/Identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/bundle.schema.json#/$defs/BundlePublishRequest
      responses:
        '201':
          description: Signed bundle; clients must verify signature, hash, tenant,
            trust claims and freshness before adoption
          headers:
            ETag:
              schema:
                type: string
              description: Quoted immutable sequence
            X-Request-ID:
              schema:
                type: string
              description: Server correlation ID
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/bundle.schema.json#/$defs/SignedPolicyBundle
        '400':
          description: Malformed or unsupported input; required fields/key missing
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '401':
          description: Valid short-lived access token required
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '403':
          description: Role forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '404':
          description: No publication or historical version in this tenant
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '409':
          description: Stale directory/bundle sequence or changed idempotency request
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '503':
          description: Signing disabled, signing failure or database unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
  /api/control/v1/bundles/rollback:
    post:
      operationId: rollbackPolicyBundle
      description: Admin only. rollbackOf is required and selects an existing tenant
        version. Copies its exact policy bytes into expectedSequence+1 with fresh
        signed expiry, new signature, audit and replay. Does not rewind sequence or
        mutate history.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: ../schemas/v1/identifiers.schema.json#/$defs/Identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/bundle.schema.json#/$defs/BundlePublishRequest
      responses:
        '201':
          description: Signed bundle; clients must verify signature, hash, tenant,
            trust claims and freshness before adoption
          headers:
            ETag:
              schema:
                type: string
              description: Quoted immutable sequence
            X-Request-ID:
              schema:
                type: string
              description: Server correlation ID
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/bundle.schema.json#/$defs/SignedPolicyBundle
        '400':
          description: Malformed or unsupported input; required fields/key missing
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '401':
          description: Valid short-lived access token required
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '403':
          description: Role forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '404':
          description: No publication or historical version in this tenant
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '409':
          description: Stale directory/bundle sequence or changed idempotency request
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '503':
          description: Signing disabled, signing failure or database unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
  /api/control/v1/openapi:
    get:
      operationId: getControlOpenApi
      description: Requires toolgate-admin or toolgate-reader and valid tenant identity
        claims. Returns this API with all schemas embedded.
      responses:
        '200':
          description: Self-contained OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Verified access token and valid identity claims required
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '403':
          description: Role forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
  /api/control/v1/users:
    get:
      operationId: listControlUser
      description: Requires toolgate-admin or toolgate-reader.
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted revision
              schema:
                type: string
            X-Request-ID:
              description: Server correlation ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/control.schema.json#/$defs/ControlUserPage
        '400': &id002
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '401': &id003
          description: Verified access token required
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '403': &id004
          description: Role forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '404': &id005
          description: Not found
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '409': &id006
          description: Revision, reference, quota or idempotency conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '413': &id007
          description: Transport request size limit; may be rejected before the API
            error envelope is available
        '415': &id008
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '500': &id009
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '503': &id010
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    post:
      operationId: createControlUser
      description: Requires toolgate-admin.
      responses:
        '201':
          description: Success
          headers:
            ETag:
              description: Quoted revision
              schema:
                type: string
            X-Request-ID:
              description: Server correlation ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/control.schema.json#/$defs/ControlUser
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '413': *id007
        '415': *id008
        '500': *id009
        '503': *id010
