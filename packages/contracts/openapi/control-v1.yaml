              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/control.schema.json#/$defs/ControlUserPage
        '400': &id001
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '401': &id002
          description: Verified access token required
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '403': &id003
          description: Role forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '404': &id004
          description: Not found
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '409': &id005
          description: Revision, reference, quota or idempotency conflict
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '413': &id006
          description: Transport request size limit; may be rejected before the API error envelope is available
        '415': &id007
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '500': &id008
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
        '503': &id009
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/error.schema.json#/$defs/ErrorEnvelope
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    post:
      operationId: createControlUser
      description: Requires toolgate-admin.
      responses:
        '201':
          description: Success
          headers:
            ETag:
              description: Quoted revision
              schema:
                type: string
            X-Request-ID:
              description: Server correlation ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/control.schema.json#/$defs/ControlUser
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '413': *id006
        '415': *id007
        '500': *id008
        '503': *id009
      parameters:
      - &id010
        name: Idempotency-Key
        in: header
        required: true
        description: Opaque request identity, scoped to verified tenant and actor, retained for seven
          days. Reuse with a different request fails.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:/-]{0,127}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/control.schema.json#/$defs/ControlUser
  /api/control/v1/users/{id}:
