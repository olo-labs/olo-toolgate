[package]
name = "olo-toolgate-contracts"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared protocol and data contracts for OLO ToolGate"
repository = "https://github.com/olo-labs/olo-toolgate"
homepage = "https://github.com/olo-labs/olo-toolgate"
readme = "README.md"
publish = true

[lib]
name = "olo_toolgate_contracts"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
